language: node_js
node_js:
  - 22 # keep in sync with .nvmrc
cache: npm
branches:
  only:
    - dev # build development branch only
install:
  - npm ci
before_script:
  - node decrypt.js $DECRYPT_TOKEN # decrypt the encrypted files
script:
  - npm run build # generate static files
deploy:
  provider: pages
  skip-cleanup: true
  github-token: $GH_TOKEN
  keep-history: true
  target-branch: master # deploy to branch 'master'
  on:
    branch: dev
  local-dir: public
after_script:
  - node cleanup.js # clean up the decrypted files